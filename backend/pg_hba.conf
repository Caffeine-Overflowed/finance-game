# Локальные подключения (Unix-сокеты)
local   all             all                                     trust

# IPv4 подключения (разрешаем подключения со всех адресов)
host    all             all             0.0.0.0/0               trust

# IPv6 подключения (только для localhost)
host    all             all             ::1/128                 trust

# Локальные подключения для репликации
local   replication     all                                     trust

# IPv4 подключения для репликации
host    replication     all             0.0.0.0/0               md5

# IPv6 подключения для репликации
host    replication     all             ::1/128                 trust
