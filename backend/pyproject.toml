[tool.poetry]
name = "auth-graphql-api"
version = "0.1.0"
description = "GraphQL API with authentication and OAuth"
authors = ["Caffeine Overflow"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.11"
strawberry-graphql = { extras = ["fastapi"], version = "^0.281.0" }
uvicorn = "^0.35.0"
sqlalchemy = { extras = ["asyncpg"], version = "^2.0.43" }
loguru = "^0.7.3"
asyncpg = "^0.30.0"
greenlet = "^3.2.4"
redis = "^6.4.0"
bcrypt = "^4.3.0"
authlib = "^1.6.3"
httpx = "^0.28.1"
google-genai = "^1.33.0"

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
python-dotenv = "^1.0.1"

[tool.poetry.group.migration.dependencies]
alembic = "^1.15.1"
psycopg2-binary = "^2.9.10"

[tool.poetry.group.production]
optional = true
[tool.poetry.group.production.dependencies]
uvloop = "^0.21.0"
gunicorn = "^21.2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
